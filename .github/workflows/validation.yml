name: Java CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: employeeapp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path:5pom.xml

      - name: Validate
        run: ./mvnw validate

      - name: Test
        run: ./mvnw test

      - name: Build
        run: ./mvnw clean package -DskipTests
